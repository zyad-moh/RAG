global:
  scrape_interval: 15s # جديدة  metrics كل 15 ثانية ابدا جمع 
  evaluation_interval: 15s

scrape_configs: # places promethues will listen on it 
  - job_name : 'fastapi' 
    static_configs:
     - targets : ['fastapi:8000']
    metrics_path : '/for_sec'

  - job_name : 'node-exporter' 
    static_configs:
     - targets : ['node-exporter:9100']
  
  - job_name : 'prometheus' 
    static_configs:
     - targets : ['localahost:9090']

  - job_name : 'qdrant' 
    static_configs:
     - targets : ['qdrant:6333']
    metrics_path : '/metrics' #build in no need to exporter

  - job_name : 'postgres' 
    static_configs:
     - targets : ['postgres-exporter:9187']
   